<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#168447" />
<title>Scrap अड्डा — Android App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
/* ============ Scrap अड्डा — design tokens ============ */
:root{
  --green:#168447; --green-dark:#0B5D35; --green-light:#E7F3EC; --green-line:#BFE0CD;
  --orange:#E9711C; --orange-light:#FCEBDC; --orange-line:#F3C79A;
  --blue:#1F6FEB; --blue-light:#E8F0FE; --blue-line:#BBD4FB;
  --ink:#16241C; --muted:#65746C; --line:#E6EAE7; --bg:#F4F6F4; --surface:#FFFFFF;
  --radius-lg:16px; --radius-md:12px; --radius-sm:10px; --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(16,24,18,.04), 0 1px 8px rgba(16,24,18,.05);
  --shadow-pop:0 12px 32px rgba(16,24,18,.18);
  --accent:var(--green); --accent-dark:var(--green-dark); --accent-light:var(--green-light); --accent-line:var(--green-line);
  --danger:#C4341F; --danger-light:#FBE9E7;
  --font-latin:'Inter',system-ui,sans-serif; --font-hi:'Noto Sans Devanagari','Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --ink:#F2F6F3; --muted:#9BA79F; --line:#29342D; --bg:#0F1511; --surface:#18201B;
  --green-light:#12301F; --orange-light:#3A2413; --blue-light:#122036;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  --shadow-pop:0 16px 40px rgba(0,0,0,.55);
}
[data-role="aggregator"]{ --accent:var(--orange); --accent-dark:#B85814; --accent-light:var(--orange-light); --accent-line:var(--orange-line); }
[data-role="recycler"]{ --accent:var(--blue); --accent-dark:#1450AD; --accent-light:var(--blue-light); --accent-line:var(--blue-line); }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:#E4E8E3;font-family:var(--font-hi);color:var(--ink);-webkit-font-smoothing:antialiased;}
[data-theme="dark"] body{background:#050705;}

/* ---------- device viewport ---------- */
.viewport-wrap{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:0;}
.device{
  width:390px;min-height:844px;max-height:844px;margin:28px auto;
  background:var(--bg);border-radius:32px;overflow:hidden;position:relative;
  box-shadow:var(--shadow-pop), 0 0 0 9px #101512, 0 0 0 10px #2b332d;
  display:flex;flex-direction:column;
}
@media (max-width:600px){
  .device{width:100%;min-height:100dvh;max-height:none;margin:0;border-radius:0;box-shadow:none;box-shadow:none;}
  body{background:var(--bg);}
}

#app{display:flex;flex-direction:column;flex:1;min-height:0;position:relative;}

/* status bar (mock) */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:9px 22px 4px;font-size:12.5px;font-weight:700;color:var(--ink);flex-shrink:0;background:var(--surface);}
.statusbar .icons{display:flex;align-items:center;gap:5px;}
.statusbar svg{width:15px;height:15px;}

/* ---------- top app bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:5;}
.topbar.on-accent{background:linear-gradient(160deg,var(--accent),var(--accent-dark));border-bottom:none;}
.topbar.on-accent .apptitle,.topbar.on-accent .appsub{color:#fff;}
.topbar.on-accent .backbtn{background:rgba(255,255,255,.16);color:#fff;}
.backbtn{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--bg);border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.backbtn-spacer{width:36px;height:36px;flex-shrink:0;}
.bellbtn{position:relative;}
.globe-wrap{position:relative;height:200px;border-radius:var(--radius-lg);overflow:hidden;background:radial-gradient(circle at 30% 20%,#0F5C36,#04190E 78%);margin-top:4px;display:flex;align-items:center;justify-content:center;}
.globe-orb{position:relative;width:148px;height:148px;border-radius:50%;overflow:hidden;box-shadow:0 0 36px rgba(46,157,94,.4), inset -16px -16px 30px rgba(0,0,0,.5), inset 10px 10px 22px rgba(255,255,255,.15);flex-shrink:0;}
.globe-orb svg{position:absolute;top:0;left:0;height:100%;width:200%;display:block;}
@media (prefers-reduced-motion: no-preference){ .globe-spin{animation:globespin 24s linear infinite;} }
@keyframes globespin{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.globe-sheen{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.38), rgba(255,255,255,0) 46%);pointer-events:none;}
.globe-brandrow{position:absolute;bottom:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;}
.globe-brandrow .gname{font-size:14px;font-weight:800;letter-spacing:.3px;}
.globe-brandrow .gtag{font-size:9.5px;color:#B9E3C6;}
.lower-section-title{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 4px 8px;}
.backbtn svg{width:19px;height:19px;}
.topbar .titlewrap{flex:1;min-width:0;}
.apptitle{font-size:17px;font-weight:700;margin:0;line-height:1.25;color:var(--ink);}
.appsub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px;}
.topbar .trailing{flex-shrink:0;color:var(--muted);}

/* brand lockup */
.brandmark{display:flex;align-items:center;gap:9px;}
.brandmark .logo{width:34px;height:34px;flex-shrink:0;}
.brandmark b{font-size:19px;font-weight:800;letter-spacing:-.2px;}
.brandmark small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:1px;}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;-webkit-overflow-scrolling:touch;}
.content.no-pad-top{padding-top:0}

/* ---------- typography helpers ---------- */
h2.sec-title{font-size:16px;font-weight:700;margin:0 0 10px;color:var(--ink);}
h3.card-title{font-size:14.5px;font-weight:700;margin:0 0 2px;color:var(--ink);}
p.body-text{margin:2px 0;font-size:13px;color:var(--muted);line-height:1.55;}
.small{font-size:11.5px;color:var(--muted);}
.bignum{font-size:30px;font-weight:800;letter-spacing:-.3px;margin:6px 0;color:var(--ink);}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);margin-bottom:12px;}
.card.tight{padding:12px 14px;}
.card.flat{border:none;box-shadow:none;background:transparent;padding:0;}
.hero-card{background:linear-gradient(165deg,var(--accent-light),var(--surface) 60%);border:1px solid var(--accent-line);border-radius:var(--radius-lg);padding:22px 18px;text-align:center;margin-bottom:14px;}
.hero-icon{width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.hero-icon svg{width:26px;height:26px;}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:var(--radius-md);height:50px;padding:0 18px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:var(--font-hi);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s ease, opacity .12s ease;}
.btn:active{transform:scale(.98);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn svg{width:18px;height:18px;flex-shrink:0;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-outline{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);}
.btn-ghost{background:var(--accent-light);color:var(--ink);}
.btn-danger{background:var(--danger-light);color:var(--danger);}
.btn-neutral{background:var(--bg);border:1px solid var(--line);color:var(--ink);}
.btn-google{background:#fff;border:1px solid #DADCE0;color:#3C4043;height:50px;border-radius:var(--radius-sm);}
.btn-sm{height:38px;padding:0 14px;font-size:12.5px;border-radius:var(--radius-sm);width:auto;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* ---------- chips / status ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-pill);background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--radius-pill);white-space:nowrap;}
.status svg{width:12px;height:12px;}
.status.ok{background:var(--green-light);color:var(--green-dark);}
.status.warn{background:var(--orange-light);color:#8A5313;}
.status.pending{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
.status.info{background:var(--blue-light);color:var(--blue);}

/* ---------- form fields ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input,.field select{width:100%;height:50px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:14.5px;font-family:var(--font-hi);background:var(--surface);color:var(--ink);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.field input:disabled{color:var(--muted);background:var(--bg);}

/* ---------- lists ---------- */
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.avatar{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.avatar svg{width:21px;height:21px;}
.tapcard{cursor:pointer;}
.tapcard:active{background:var(--bg);}

/* ---------- bottom navigation ---------- */
.bottomnav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));flex-shrink:0;}
.bottomnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font-hi);padding:6px 2px;border-radius:10px;}
.bottomnav button svg{width:21px;height:21px;}
.bottomnav button.active{color:var(--accent);}

/* ---------- role select ---------- */
.role-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-bottom:12px;box-shadow:var(--shadow-card);}
.role-card:active{transform:scale(.99);}
.role-ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.role-ic svg{width:24px;height:24px;}
.role-card .chev{color:var(--muted);flex-shrink:0;}
.role-card .chev svg{width:19px;height:19px;}

/* ---------- stepper ---------- */
.stepper{display:flex;flex-direction:column;margin:4px 0;}
.step{display:flex;gap:12px;position:relative;padding-bottom:20px;}
.step:last-child{padding-bottom:0;}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;}
.step .dot svg{width:14px;height:14px;}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff;}
.step.active .dot{background:var(--surface);border-color:var(--accent);color:var(--accent);}
.step:not(:last-child)::before{content:'';position:absolute;left:12.5px;top:26px;bottom:0;width:1.5px;background:var(--line);}
.step.done:not(:last-child)::before{background:var(--green);}
.step .txt b{display:block;font-size:13.5px;font-weight:600;}
.step .txt span{font-size:11.5px;color:var(--muted);}

/* ---------- kpi ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.kpi{background:var(--surface);border-radius:var(--radius-md);padding:14px;border:1px solid var(--line);}
.kpi b{font-size:21px;display:block;font-weight:800;}
.kpi span{font-size:11px;color:var(--muted);}

/* ---------- material grid ---------- */
.material-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.mchip{border:1.5px solid var(--line);border-radius:var(--radius-md);padding:14px 10px;text-align:center;cursor:pointer;background:var(--surface);}
.mchip.sel{border-color:var(--accent);background:var(--accent-light);}
.mchip .ic-wrap{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:var(--ink);}
.mchip.sel .ic-wrap{background:var(--accent);color:#fff;}
.mchip .ic-wrap svg{width:17px;height:17px;}
.mchip b{font-size:12px;font-weight:600;}

/* ---------- camera screen ---------- */
.camera-frame{background:#0D0F0E;border-radius:var(--radius-lg);padding:14px;position:relative;overflow:hidden;}
.camera-view{height:340px;border-radius:12px;background:linear-gradient(160deg,#1a231d,#0a0d0b);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.camera-view img{width:100%;height:100%;object-fit:cover;}
.viewfinder{position:absolute;inset:22px;}
.viewfinder i{position:absolute;width:22px;height:22px;border-color:rgba(255,255,255,.85);}
.viewfinder i.tl{top:0;left:0;border-top:2.5px solid;border-left:2.5px solid;border-radius:6px 0 0 0;}
.viewfinder i.tr{top:0;right:0;border-top:2.5px solid;border-right:2.5px solid;border-radius:0 6px 0 0;}
.viewfinder i.bl{bottom:0;left:0;border-bottom:2.5px solid;border-left:2.5px solid;border-radius:0 0 0 6px;}
.viewfinder i.br{bottom:0;right:0;border-bottom:2.5px solid;border-right:2.5px solid;border-radius:0 0 6px 0;}
.camera-controls{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 6px;}
.camera-controls .side-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;border:none;}
.camera-controls .side-btn svg{width:19px;height:19px;}
.shutter{width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer;padding:0;}
.shutter:active{transform:scale(.94);}
.cam-hint{color:#B9C4BE;font-size:12px;text-align:center;margin-top:10px;}
.camera-view video{width:100%;height:100%;object-fit:cover;}
.cam-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(10,13,11,.92);color:#B9C4BE;font-size:12.5px;text-align:center;padding:0 24px;}
.detected-photo-thumb{width:100%;max-height:150px;object-fit:cover;border-radius:var(--radius-md);margin-bottom:10px;}
.scraplogo{display:inline-flex;border-radius:50%;overflow:hidden;background:#fff;flex-shrink:0;box-shadow:0 0 0 1px var(--line);}
.scraplogo img{width:100%;height:100%;object-fit:cover;display:block;}
.buyers-map{height:190px;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px;border:1px solid var(--line);background:var(--bg);position:relative;z-index:0;}
.buyers-map .map-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;text-align:center;padding:0 20px;}
.leaflet-popup-content{font-family:var(--font-hi);font-size:12.5px;}
.map-recenter{position:absolute;right:10px;bottom:10px;z-index:400;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);cursor:pointer;}
.bottomnav button{position:relative;}
.navbadge{position:absolute;top:2px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#E5484D;color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;}
.statusbar .icons{position:relative;}
.status-bell-badge{position:absolute;top:-4px;right:9px;width:7px;height:7px;border-radius:50%;background:#E5484D;border:1px solid var(--bg);}

/* ---------- chart ---------- */
.chart-wrap{margin:10px 0 4px;}
.chart-wrap svg{width:100%;height:76px;display:block;}

/* ---------- google logo btn ---------- */
.btn-google svg{width:18px;height:18px;}

/* ---------- settings ---------- */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;}
.settings-row .lbl .row-ic{width:32px;height:32px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
.settings-row .lbl .row-ic svg{width:16px;height:16px;}
.settings-row .chev{color:var(--muted);}
.settings-row .chev svg{width:17px;height:17px;}
.seg{display:flex;background:var(--bg);border-radius:var(--radius-pill);padding:3px;gap:2px;}
.seg span{padding:6px 12px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted);}
.seg span.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.toggle{width:44px;height:26px;border-radius:var(--radius-pill);background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:.15s;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.toggle.on::after{left:20px;}

/* ---------- banner / safety ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--orange-light);border:1px solid var(--orange-line);border-radius:var(--radius-md);padding:13px;font-size:12.5px;margin-bottom:12px;color:#8A5313;}
.banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
.safety-card{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
.safety-card:last-child{border:none;}
.safety-ic{width:38px;height:38px;border-radius:10px;background:var(--danger-light);color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.safety-ic svg{width:19px;height:19px;}
.safety-ic.ok{background:var(--green-light);color:var(--green-dark);}

/* ---------- misc ---------- */
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.divider{height:1px;background:var(--line);margin:12px 0;}
.center{text-align:center;}
.mt6{margin-top:6px;}.mt8{margin-top:8px;}.mt10{margin-top:10px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}
.empty{text-align:center;padding:52px 10px;color:var(--muted);}
.empty svg{width:38px;height:38px;margin-bottom:10px;color:var(--muted);}
a.linklike{color:var(--accent);font-weight:700;text-decoration:none;font-size:13px;cursor:pointer;}

/* ---------- modal / snackbar ---------- */
.modal-backdrop{position:absolute;inset:0;background:rgba(10,20,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:up .18s ease-out;}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.modal-icon svg{width:26px;height:26px;}
.snackbar{position:absolute;left:16px;right:16px;bottom:20px;background:#16241C;color:#fff;padding:13px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transform:translateY(10px);transition:.2s ease;z-index:70;box-shadow:0 10px 28px rgba(0,0,0,.3);text-align:center;pointer-events:none;}
.snackbar.show{opacity:1;transform:translateY(0);}

/* ---------- verified badge ---------- */
.verified{display:inline-flex;align-items:center;gap:3px;color:var(--green-dark);font-size:11px;font-weight:700;}
.verified svg{width:13px;height:13px;}

/* ---------- rating ---------- */
.rating{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink);}
.rating svg{width:13px;height:13px;color:#F5A623;}

/* accessibility */
button, .chip, .role-card, .toggle, .backbtn{outline-offset:2px;}
button:focus-visible, .chip:focus-visible{outline:2px solid var(--accent);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }


/* ---------- v6 visual polish ---------- */
.live-pill{font-size:8.5px;font-weight:800;letter-spacing:.5px;color:var(--green-dark);background:var(--green-light);border:1px solid var(--green-line);padding:3px 7px;border-radius:999px;}
[data-role="aggregator"] .live-pill{color:#8A4A12;background:var(--orange-light);border-color:var(--orange-line);}
[data-role="recycler"] .live-pill{color:#1450AD;background:var(--blue-light);border-color:var(--blue-line);}
.page-end-card{display:flex;align-items:center;gap:10px;margin:14px 0 2px;padding:12px;border:1px solid var(--accent-line);border-radius:14px;background:linear-gradient(135deg,var(--accent-light),var(--surface));box-shadow:var(--shadow-card);}
.page-end-card>div:nth-child(2){flex:1;min-width:0;}
.page-end-card b{font-size:11.5px;display:block;}
.page-end-card p{font-size:10.5px;color:var(--muted);line-height:1.35;margin:2px 0 0;}
.page-end-icon{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0;}
.page-end-card .status{font-size:9px;padding:4px 7px;}
.home-hero{background:linear-gradient(145deg,var(--accent-dark),var(--accent));color:#fff;border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;}
.home-hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;right:-55px;top:-55px;background:rgba(255,255,255,.12);}
.home-hero .eyebrow{font-size:10px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.5px;}
.home-hero h2{margin:5px 0;font-size:21px;position:relative;z-index:1;}
.home-hero p{margin:0;color:rgba(255,255,255,.86);font-size:12px;position:relative;z-index:1;}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0;}
.quick-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;box-shadow:var(--shadow-card);}
.quick-tile .qic{width:36px;height:36px;border-radius:11px;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.quick-tile b{font-size:12.5px;display:block;}
.quick-tile span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px;}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
.stat-tile b{display:block;font-size:15px;font-weight:800;}
.stat-tile span{font-size:9.5px;color:var(--muted);}
.role-hero{background:linear-gradient(145deg,#0B5D35,#168447 55%,#37A66A);color:#fff;border-radius:20px;padding:20px 16px;margin-bottom:14px;position:relative;overflow:hidden;text-align:center;}
.role-hero:before,.role-hero:after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.16);}
.role-hero:before{width:190px;height:190px;right:-80px;top:-95px;}
.role-hero:after{width:130px;height:130px;left:-70px;bottom:-80px;}
.role-hero .brandname{font-size:25px;font-weight:800;margin-top:8px;}
.role-hero .tag{font-size:12px;color:#DDF5E5;margin-top:2px;}
.role-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px;}
.role-metrics div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:8px 4px;}
.role-metrics b{display:block;font-size:13px;}
.role-metrics span{font-size:8.5px;opacity:.82;}
.directions-modal{position:absolute;inset:0;background:rgba(5,13,9,.78);z-index:9999;display:flex;align-items:flex-end;pointer-events:auto;overflow:hidden;}
.directions-sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-pop);position:relative;z-index:10000;}
.map3d{height:220px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(160deg,#dcefdc,#c5dfc8);perspective:600px;border:1px solid var(--line);}
.map3d .terrain{position:absolute;inset:-40px -20px;transform:rotateX(58deg) rotateZ(-7deg) scale(1.12);background:repeating-linear-gradient(0deg,rgba(35,90,55,.13) 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,rgba(35,90,55,.12) 0 2px,transparent 2px 32px);}
.map3d .route3d{position:absolute;left:15%;top:70%;width:72%;height:6px;background:#168447;border-radius:999px;transform:rotate(-20deg);box-shadow:0 0 0 4px rgba(255,255,255,.65),0 8px 16px rgba(10,50,25,.18);}
.map3d .pin3d{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;background:#E5484D;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(0,0,0,.2);}
.map3d .pin3d.user{left:13%;top:72%;}
.map3d .pin3d.dest{right:13%;top:27%;}
.map3d .road-label{position:absolute;background:rgba(255,255,255,.85);padding:4px 7px;border-radius:8px;font-size:9px;font-weight:700;color:#34513D;box-shadow:0 2px 7px rgba(0,0,0,.08);}
.map3d .label-a{left:8%;top:12%}.map3d .label-b{right:8%;bottom:12%}
.map3d .map3d-badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);padding:6px 8px;border-radius:9px;font-size:9px;font-weight:800;color:#1450AD;}
.doc-upload{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed var(--accent-line);border-radius:12px;background:var(--accent-light);cursor:pointer;margin-bottom:10px;}
.doc-upload .doc-meta{flex:1;min-width:0;}
.doc-upload b{font-size:12px;display:block;}
.doc-upload span{font-size:10px;color:var(--muted);}
.file-pill{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:9.5px;color:var(--ink);}
.voice-hint{margin:10px 0 2px;background:var(--green-light);border:1px solid var(--green-line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:9px;color:var(--green-dark);}
.voice-hint .voice-dot{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.voice-hint b{font-size:11.5px;display:block;}
.voice-hint span{font-size:10px;color:var(--muted);display:block;margin-top:1px;}
.cam-option-label{font-size:9.5px;color:#DCE8E0;font-weight:600;margin-top:4px;text-align:center;}


</style>
</head>

function globeContinents(offsetX){
  return `<g transform="translate(${offsetX},0)" fill="#BFE9CE" opacity="0.92">
    <path d="M40 60 Q55 40 80 50 T120 55 Q135 70 120 90 T90 110 Q60 115 45 95 T40 60Z"/>
    <path d="M150 30 Q175 20 195 35 T210 60 Q195 75 170 65 T150 30Z"/>
    <ellipse cx="60" cy="140" rx="22" ry="14"/>
    <path d="M170 120 Q190 110 205 125 T195 155 Q175 160 165 140 T170 120Z"/>
    <path d="M230 45 Q250 35 265 50 T250 80 Q225 78 220 60 T230 45Z"/>
  </g>`;
}
function globeVisual(){
  return `<div class="globe-wrap">
    <div class="globe-orb">
      <svg class="globe-spin" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
        <defs><radialGradient id="oceanG" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#1E8A4E"/><stop offset="100%" stop-color="#07331D"/></radialGradient></defs>
        <rect width="400" height="200" fill="url(#oceanG)"/>
        ${globeContinents(0)}
        ${globeContinents(200)}
      </svg>
      <div class="globe-sheen"></div>
    </div>
    <div class="globe-brandrow">${LOGO(26)}<span class="gname">Scrap अड्डा</span><span class="gtag">${tr('tagline')}</span></div>
  </div>`;
}
function I(name, size, cls){
  size = size||20;
  let svg = ICONS[name];
  if(!svg) return '';
  svg = svg.replace('<svg ', `<svg width="${size}" height="${size}" `);
  if(cls) svg = svg.replace('class="ic"', `class="ic ${cls}"`);
  return svg;
}
function matIcon(matId){

  return map[matId] || 'package';
}

const MY_RECYCLER_ID = 'R1';
function matchReasons(lot, rec){
  const reasons = [];
  const materialOk = rec.materials.includes(lot.material_id);
  const weightOk = lot.quantity_kg >= rec.min_weight_kg;
  if(materialOk) reasons.push('सामग्री स्वीकृत');
  if(weightOk) reasons.push('न्यूनतम वज़न पूरा');
  if(rec.pickup_available) reasons.push('पिकअप उपलब्ध');
  return { matched: materialOk && weightOk, reasons };
}
function matchedRecyclerIdsForLot(lot){
  return S.data.recyclers.filter(r=>matchReasons(lot, r).matched).map(r=>r.id);
}
function findMat(id){ return S.data.materials.find(m=>m.id===id); }
function findRec(id){ return S.data.recyclers.find(r=>r.id===id); }
function findLot(id){ return S.data.lots.find(l=>l.id===id); }

function toast(msg){
  const host = document.querySelector('.device'); if(!host) return;
  const old = host.querySelector('.snackbar'); if(old) old.remove();
  const t = document.createElement('div'); t.className='snackbar'; t.textContent = msg;

}

/* ===================== CAMERA (real getUserMedia + gallery fallback) ===================== */
const CAMERA_SCREENS = ['kw_takePhoto','ag_addPhoto'];
const CAM = { stream:null, photoData:null, torchOn:false };
let LAST_CAPTURED_PHOTO = null;
let AG_LOT_PHOTO = null;
function stopCameraStream(){
  if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; CAM.torchOn=false; }
}
function afterRenderCamera(){
  if(!CAMERA_SCREENS.includes(S.screen) || CAM.photoData){ stopCameraStream(); return; }
  const video = document.getElementById('camVideo');
  if(!video) return;
  if(CAM.stream){ video.srcObject = CAM.stream; return; }
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false}).then(stream=>{
      CAM.stream = stream;
      const v = document.getElementById('camVideo');
      if(v && S.screen==='kw_takePhoto' && !CAM.photoData){ v.srcObject = stream; }
      else { stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; }
    }).catch(()=>{
      const fb = document.getElementById('camFallback');
      if(fb) fb.style.display='flex';
    });
  } else {
    const fb = document.getElementById('camFallback');
    if(fb) fb.style.display='flex';
  }
}
function makePlaceholderPhoto(){
  const c = document.createElement('canvas'); c.width=320; c.height=320;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a231d'; ctx.fillRect(0,0,320,320);
  ctx.strokeStyle = '#3a453e'; ctx.lineWidth=4; ctx.strokeRect(20,20,280,280);
  ctx.fillStyle = '#B9C4BE'; ctx.font = '16px sans-serif'; ctx.textAlign='center';
  ctx.fillText('फोटो उपलब्ध नहीं', 160, 165);
  return c.toDataURL('image/jpeg',0.85);
}
function capturePhoto(){
  const video = document.getElementById('camVideo');
  const canvas = document.getElementById('camCanvas');
  if(video && canvas && video.videoWidth){
    const maxW = 480;
    const scale = Math.min(1, maxW/video.videoWidth);
    canvas.width = video.videoWidth*scale; canvas.height = video.videoHeight*scale;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    CAM.photoData = canvas.toDataURL('image/jpeg',0.8);
  } else {
    CAM.photoData = makePlaceholderPhoto();
  }
  stopCameraStream();
  render();
}
function handleGalleryFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    CAM.photoData = ev.target.result;
    stopCameraStream();
    render();
  };
  reader.readAsDataURL(file);
}
function retakePhoto(){ CAM.photoData = null; render(); }
function usePhoto(){
  LAST_CAPTURED_PHOTO = CAM.photoData;
  CAM.photoData = null;
  go('kw_detection',{matId:'M1'});
}
function useLotPhoto(){
  AG_LOT_PHOTO = CAM.photoData;
  CAM.photoData = null;
  go('ag_materialSelect');
}
function toggleTorch(){
  if(!CAM.stream){ toast('कैमरा सक्रिय नहीं है'); return; }
  const track = CAM.stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if(caps && caps.torch){
    CAM.torchOn = !CAM.torchOn;
    track.applyConstraints({advanced:[{torch:CAM.torchOn}]}).catch(()=>{});
    toast(CAM.torchOn?'फ्लैश चालू':'फ्लैश बंद');
  } else {
    toast('इस डिवाइस पर फ्लैश उपलब्ध नहीं है');
  }
}

    const map = L.map(container, {zoomControl:false, attributionControl:true}).setView([center.lat, center.lng], 12);
    BUYERS_MAP_INSTANCE = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    if(hasRealLoc){
      L.circleMarker([center.lat, center.lng], {radius:7, color:'#1F6FEB', fillColor:'#1F6FEB', fillOpacity:0.9, weight:2})
        .addTo(map).bindPopup('आपका स्थान');
    }
    list.forEach(r=>{
      if(r.lat==null || r.lng==null) return;
      const marker = L.marker([r.lat, r.lng]).addTo(map);
      marker.bindPopup(`<b>${r.name}</b><br/>₹${r.rate_per_kg}/किलो · ${I('star',10)} ${r.rating}`);
      marker.on('click', ()=>{ go('kw_buyerDetail',{recId:r.id, matId:mat.id}); });
    });
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 60);
  };
  if(USER_LOC){ drawMap(USER_LOC, true); return; }
  if(!S.locationOn || !navigator.geolocation){ drawMap(JAIPUR_CENTER, false); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ USER_LOC = {lat:pos.coords.latitude, lng:pos.coords.longitude}; if(S.screen==='kw_nearbyBuyers') drawMap(USER_LOC, true); },
    ()=>{ drawMap(JAIPUR_CENTER, false); },
    {timeout:4000}
  );
  drawMap(JAIPUR_CENTER, false); // draw immediately with fallback center while permission resolves
}

function chartSvg(trend, max){
  const w=300,h=70,pad=4;
  const pts = trend.map((v,i)=>{
    const x = pad + (i/(trend.length-1))*(w-2*pad);
    const y = h - pad - (v/max)*(h-2*pad);
    return [x,y];
  });
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const last = pts[pts.length-1];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#cg)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="var(--accent)"/>
  </svg></div>`;
}

/* ---- Shared pipeline (role = 'ag' | 'rc') ---- */
function pipeSteps(t){
  return [
    {k:'pickup_done', label:'पिकअप रास्ते में', ic:'truck'},
    {k:'weight_verified', label:'वज़न जांच', ic:'scale'},
    {k:'quality_checked', label:'गुणवत्ता जांच', ic:'clipboardCheck'},
    {k:'final_price_set', label:'अंतिम कीमत पुष्टि', ic:'indianRupee'},
    {k:'payment_done', label:'लेनदेन पूरा', ic:'check'}
  ].map((s)=>{
    let done;
    if(s.k==='final_price_set') done = !!t.final_price;
    else if(s.k==='payment_done') done = t.status==='completed';
    else done = !!t[s.k];
    return {...s, done};
  });
}
function stepperHtml(t){
  const steps = pipeSteps(t);
  let activeSet=false;
  return `<div class="stepper">${steps.map(s=>{
    let cls = s.done?'done':'';
    if(!s.done && !activeSet){ cls='active'; activeSet=true; }

function relTime(n){
  if(!n.ts) return n.time;
  const diffMin = Math.floor((Date.now()-n.ts)/60000);
  if(diffMin<1) return S.lang==='en'?'just now':S.lang==='mr'?'आत्ताच':'अभी';
  if(diffMin<60) return S.lang==='en'?`${diffMin} min ago`:S.lang==='mr'?`${diffMin} मिनिटांपूर्वी`:`${diffMin} मिनट पहले`;
  const diffHr = Math.floor(diffMin/60);
  if(diffHr<24) return S.lang==='en'?`${diffHr} hr ago`:S.lang==='mr'?`${diffHr} तासांपूर्वी`:`${diffHr} घंटे पहले`;
  const diffDay = Math.floor(diffHr/24);
  return S.lang==='en'?`${diffDay} d ago`:S.lang==='mr'?`${diffDay} दिवसांपूर्वी`:`${diffDay} दिन पहले`;
}
function openNotif(id, role){

  if(contentStart<0) return html;
  const contentEnd=navAt>=0 ? html.lastIndexOf('</div>',navAt) : html.lastIndexOf('</div>');

function stopVoiceGuide(){
  if(VOICE_TIMER) clearTimeout(VOICE_TIMER);
  if(VOICE_REPEAT) clearInterval(VOICE_REPEAT);
  VOICE_TIMER=null; VOICE_REPEAT=null; VOICE_ACTIVE=false;
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}
function unlockVoiceEngine(){
  if(VOICE_UNLOCKED || !('speechSynthesis' in window)) return;
  try{
    const u=new SpeechSynthesisUtterance('');
    u.lang='hi-IN'; u.volume=0; u.rate=1;
    window.speechSynthesis.speak(u);
    VOICE_UNLOCKED=true;
  }catch(e){}
}
function pickHindiVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices=window.speechSynthesis.getVoices()||[];
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const hindi=voices.filter(v=>/^hi(-|_)/i.test(v.lang)||/hindi|हिन्दी|हिंदी/i.test(v.name));
  if(!hindi.length) return voices.find(v=>/^hi(-|_)/i.test(v.lang))||null;
  const female=/female|woman|girl|kalpana|swara|neerja|aarti|google.*hindi.*female/i;
  const male=/male|man|ravi|hemant|madhur|google.*hindi.*male/i;
  if(mobile){
    return hindi.find(v=>female.test(v.name)) || hindi.find(v=>/google/i.test(v.name)) || hindi[0];
  }
  return hindi.find(v=>male.test(v.name)) || hindi.find(v=>/microsoft.*ravi|ravi|hemant|madhur/i.test(v.name)) || hindi[0];
}
function speakGuide(){
  const text=VOICE_TEXT[S.screen];
  if(!text || S.voiceOn===false || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    if(window.speechSynthesis.resume) window.speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='hi-IN'; u.rate=0.95; u.pitch=1; u.volume=1;
    const v=pickHindiVoice();
    if(v) u.voice=v;
    u.onstart=()=>{VOICE_ACTIVE=true;};
    u.onend=()=>{VOICE_ACTIVE=false;};
    u.onerror=()=>{VOICE_ACTIVE=false;};
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function startVoiceGuide(){
  stopVoiceGuide();
  if(S.voiceOn===false || !VOICE_TEXT[S.screen]) return;
  VOICE_TIMER=setTimeout(()=>{ speakGuide(); },700);
}
function toggleVoiceGuide(){ S.voiceOn=S.voiceOn===false; save(); stopVoiceGuide(); render(); }
document.addEventListener('pointerdown', ()=>unlockVoiceEngine(), {passive:true, once:true});
